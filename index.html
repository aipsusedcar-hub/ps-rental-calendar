<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS Car Rental Calendar</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--o:#f97316;--ink:#111827;--muted:#667085;--line:#eaecf0}*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;font-family:Arial,"Noto Sans Thai",sans-serif;color:var(--ink)}
.app{max-width:520px;min-height:100vh;margin:auto;background:#fff}
.head{background:var(--o);color:#fff;padding:18px;border-radius:0 0 22px 22px}.head b{font-size:20px}.hint{font-size:13px;margin-top:5px}
.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1;border:0;border-radius:10px;padding:10px;background:#ffffff38;color:#fff;font-size:15px;cursor:pointer}
.tabs .on{background:#fff;color:var(--o);font-weight:700}.tabs small{display:block;font-size:12px;font-weight:400;margin-top:2px}
main{padding:16px}.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{border:0;background:#fff;color:#667085;font-size:28px;width:42px;height:42px;cursor:pointer}.nav button:disabled{opacity:.25}
.label{border:0;background:#fff;font-size:21px;font-weight:700;color:var(--ink);cursor:pointer}
.picker{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.picker.show{display:grid}
.picker button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:15px}
.picker button.active{border-color:var(--o);color:var(--o);font-weight:700}.picker button:disabled{color:#d0d5dd}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;color:var(--muted);font-size:13px;padding:8px 0;font-weight:700}
.day{height:44px;border:0;background:#fff;border-radius:22px;font-size:16px;cursor:pointer}
.day:disabled{color:#d0d5dd;cursor:default}.day.today{outline:1px solid var(--o);color:var(--o)}
.day.sel{background:var(--o);color:#fff;font-weight:700}.day.inrange{background:#ffedd5;border-radius:6px}
.sum{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;font-size:15px;text-align:center}.sum b{color:var(--o)}
.sec{display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.sec.show{display:block}
.tt{font-weight:700;font-size:16px;margin-bottom:10px}.tt span{color:var(--o)}
.tt i{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:11px;background:var(--o);color:#fff;font-style:normal;font-size:13px;text-align:center;margin-right:7px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-size:15px;cursor:pointer}
.times button.sel{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}.times button:disabled{color:#d0d5dd;cursor:default}
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.locs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-size:15px;cursor:pointer}
.locs button.sel{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}
.locin{display:none;width:100%;margin-top:8px;border:1px solid var(--o);border-radius:10px;padding:11px;font-size:15px}.locin.show{display:block}
.alert{display:none;margin-top:16px;background:#fff7ed;border:1px dashed var(--o);border-radius:12px;padding:13px;font-size:15px;text-align:center;line-height:1.6}.alert.show{display:block}.alert b{color:var(--o)}
.alert button{margin-top:10px;border:0;border-radius:10px;padding:11px 18px;background:var(--o);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.done{display:none;margin-top:16px;background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;line-height:1.6}.done.show{display:block}
.done b{color:var(--o)}.done .edit{float:right;border:1px solid var(--o);background:#fff;color:var(--o);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
.recap{display:none;margin-top:18px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:13px;font-size:14px;line-height:1.7}.recap.show{display:block}.recap b{color:var(--o)}
.send{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;background:var(--o);color:#fff;font-size:16px;font-weight:700;cursor:pointer}.send:disabled{background:#fed7aa}
#msg,#err{font-size:13px;text-align:center;margin-top:14px}#err{color:#b42318}
</style></head>
<body><div class="app">
<div class="head"><b>เลือกวันเช่ารถ</b><div class="hint">แตะวันรับรถ → เลือกสถานที่/เวลารับ → แตะวันคืนรถ → เลือกสถานที่/เวลาคืน</div>
<div class="tabs"><button id="tabPickup">วันรับรถ<small id="pickTxt">-</small></button><button id="tabReturn">วันคืนรถ<small id="retTxt">-</small></button></div></div>
<main>
<div class="nav"><button id="prevBtn" aria-label="เดือนก่อน">‹</button><button id="yearLabel" class="label"></button><button id="nextBtn" aria-label="เดือนถัดไป">›</button></div>
<div id="yearPicker" class="picker"></div><div id="monthPicker" class="picker"></div>
<div class="nav"><button id="monthLabel" class="label" style="width:auto"></button><span></span><span></span></div>
<div class="week"><div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div></div>
<div id="grid" class="grid"></div>
<div class="sum" id="sum">กรุณาแตะเลือก<b>วันรับรถ</b></div>

<div id="pickDone" class="done"></div>

<div id="secPickLoc" class="sec"><div class="tt"><i>1</i>สถานที่รับรถ</div>
  <div id="pickLocs" class="locs"></div>
  <input id="pickLocIn" class="locin" maxlength="120" placeholder="พิมพ์สถานที่รับรถ เช่น โรงแรม..., ที่อยู่"></div>

<div id="secPickTime" class="sec"><div class="tt"><i>2</i>เวลารับรถ · <span id="pickTimeDay"></span></div>
  <div id="pickTimes" class="times"></div></div>

<div id="needRet" class="alert">✅ ข้อมูล<b>รับรถ</b>ครบแล้ว<br>กรุณาแตะเลือก<b>วันคืนรถ</b>ในปฏิทินด้านบน
  <br><button id="goCal" type="button">เลื่อนขึ้นไปเลือกวันคืนรถ</button></div>

<div id="secRetLoc" class="sec"><div class="tt"><i>3</i>สถานที่คืนรถ</div>
  <div id="retLocs" class="locs"></div>
  <input id="retLocIn" class="locin" maxlength="120" placeholder="พิมพ์สถานที่คืนรถ เช่น โรงแรม..., ที่อยู่"></div>

<div id="secRetTime" class="sec"><div class="tt"><i>4</i>เวลาคืนรถ · <span id="retTimeDay"></span></div>
  <div id="retTimes" class="times"></div></div>

<div id="recap" class="recap"></div>
<button id="sendBtn" class="send" disabled>กรุณาเลือกวันรับรถ</button>
<div id="msg"></div><div id="err"></div>
<div style="text-align:center;color:#d0d5dd;font-size:11px;margin-top:18px">v12 · 2026-11-12</div>
</main></div>
<script>
const LIFF_ID='2012569735-v6ST3dSo';
const months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const $=id=>document.getElementById(id);
const now=new Date(),minDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()),maxDate=new Date(now.getFullYear()+2,11,31);
const mAbbr=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const dmy=d=>d.getDate()+' '+mAbbr[d.getMonth()]+' '+(d.getFullYear()+543);
const th=d=>d?dmy(d):'-';
// สถานที่รับ-คืนรถ (ตรงกับปุ่มในแชตบอต)
const LOCS=['บขส.','สนามบิน','อื่นๆ'];
// ช่วงเวลา 08:00–18:00 ทุก 30 นาที (แก้ตรงนี้ได้)
const TIMES=[];for(let h=8;h<=18;h++){TIMES.push(String(h).padStart(2,'0')+':00');if(h<18)TIMES.push(String(h).padStart(2,'0')+':30')}
// v11: แตะวันรับ -> สถานที่รับ -> เวลารับ -> ยุบกล่องรับรถเป็นสรุป + เตือนให้แตะวันคืน
//      -> แตะวันคืน -> สถานที่คืน/เวลาคืน "เริ่มเป็นค่าว่างเสมอ" -> ยืนยันครั้งเดียว
let pickupDate=null,returnDate=null,focus='pickup';
let pickLoc=null,pickTime=null,retLoc=null,retTime=null;
let editPick=false;   // true = กำลังแก้ไขขั้นรับรถ (กางกล่อง 1-2 อีกครั้ง)
let view=new Date(minDate.getFullYear(),minDate.getMonth(),1);
const ready=liff.init({liffId:LIFF_ID}).catch(e=>{$('err').textContent='เปิด LIFF ไม่สำเร็จ: '+(e.message||e);throw e});
const sameDay=(a,b)=>a&&b&&a.toDateString()===b.toDateString();
const scrollTo=id=>setTimeout(()=>{const e=$(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},90);

function draw(){
  $('yearLabel').textContent=view.getFullYear()+543;$('monthLabel').textContent=months[view.getMonth()];
  $('pickTxt').textContent=th(pickupDate);$('retTxt').textContent=th(returnDate);
  $('tabPickup').classList.toggle('on',focus==='pickup');$('tabReturn').classList.toggle('on',focus==='return');
  const g=$('grid');g.innerHTML='';
  const first=new Date(view.getFullYear(),view.getMonth(),1).getDay(),days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  const lo=focus==='return'&&pickupDate?pickupDate:minDate;
  for(let i=0;i<first;i++)g.appendChild(document.createElement('span'));
  for(let d=1;d<=days;d++){
    const date=new Date(view.getFullYear(),view.getMonth(),d),b=document.createElement('button');
    b.className='day';b.textContent=d;
    if(date<lo||date>maxDate)b.disabled=true;else b.onclick=()=>pick(date);
    if(sameDay(date,now))b.classList.add('today');
    if(sameDay(date,pickupDate)||sameDay(date,returnDate))b.classList.add('sel');
    else if(pickupDate&&returnDate&&date>pickupDate&&date<returnDate)b.classList.add('inrange');
    g.appendChild(b);
  }
  $('prevBtn').disabled=view<=new Date(minDate.getFullYear(),minDate.getMonth(),1);
  $('nextBtn').disabled=view>=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);
  upd();
}
function clampView(){const lo=new Date(minDate.getFullYear(),minDate.getMonth(),1),hi=new Date(maxDate.getFullYear(),maxDate.getMonth(),1);if(view<lo)view=lo;if(view>hi)view=hi}
function years(){const p=$('yearPicker');p.innerHTML='';for(let y=minDate.getFullYear();y<=maxDate.getFullYear();y++){const b=document.createElement('button');b.textContent=y+543;b.className=y===view.getFullYear()?'active':'';b.onclick=()=>{view=new Date(y,view.getMonth(),1);clampView();p.classList.remove('show');draw()};p.appendChild(b)}}
function mons(){const p=$('monthPicker');p.innerHTML='';for(let m=0;m<12;m++){const b=document.createElement('button');b.textContent=months[m];b.disabled=new Date(view.getFullYear(),m+1,0)<minDate||new Date(view.getFullYear(),m,1)>maxDate;b.className=m===view.getMonth()?'active':'';b.onclick=()=>{view=new Date(view.getFullYear(),m,1);p.classList.remove('show');draw()};p.appendChild(b)}}
// ล้างค่าขั้นคืนรถให้ว่างเสมอ
function clearReturn(){retLoc=null;retTime=null;$('retLocIn').value=''}
function clearPickup(){pickLoc=null;pickTime=null;$('pickLocIn').value=''}
function pick(date){
  $('err').textContent='';$('msg').textContent='';
  const newPickup=(focus==='pickup'||!pickupDate||date<pickupDate);
  if(newPickup){
    pickupDate=date;
    if(returnDate&&returnDate<date)returnDate=null;
    // เปลี่ยนวันรับ = เริ่มขั้นตอนใหม่ทั้งหมด ทุกกล่องเป็นค่าว่าง
    clearPickup();clearReturn();
    editPick=true;focus='return';
    draw();
    scrollTo('secPickLoc');          // 1. กล่องสถานที่รับรถเลื่อนขึ้นมาทันที
  }else{
    returnDate=date;
    // 2. แตะวันคืนรถเมื่อไหร่ สถานที่/เวลาคืนรถเริ่มเป็นค่าว่างใหม่เสมอ
    clearReturn();
    editPick=false;                  // ยุบกล่องรับรถเป็นสรุป ไม่ให้ค่าเดิมปนกับขั้นคืนรถ
    draw();
    scrollTo(pickTime?'secRetLoc':(okLoc(pickLocVal())?'secPickTime':'secPickLoc'));
  }
}
const locVal=(sel,inId)=>sel==='อื่นๆ'?$(inId).value.trim():sel;
const pickLocVal=()=>locVal(pickLoc,'pickLocIn');
const retLocVal=()=>locVal(retLoc,'retLocIn');
const okLoc=v=>!!v&&v.length>=2;

function drawLocs(boxId,inId,cur,set){
  const box=$(boxId);box.innerHTML='';
  LOCS.forEach(v=>{const b=document.createElement('button');b.textContent=v==='อื่นๆ'?'อื่นๆ (พิมพ์)':v;if(v===cur)b.classList.add('sel');
    b.onclick=()=>{set(v);if(v==='อื่นๆ')setTimeout(()=>$(inId).focus(),50)};box.appendChild(b)});
  $(inId).classList.toggle('show',cur==='อื่นๆ');
}
function drawTimes(boxId,day,cur,set,notBefore){
  const box=$(boxId);box.innerHTML='';
  const n=new Date(),isToday=sameDay(day,n),curMin=n.getHours()*60+n.getMinutes();
  TIMES.forEach(t=>{const b=document.createElement('button');b.textContent=t;const[h,m]=t.split(':').map(Number);
    if(isToday&&h*60+m<=curMin)b.disabled=true;
    if(notBefore&&h*60+m<notBefore)b.disabled=true;
    if(t===cur)b.classList.add('sel');
    b.onclick=()=>set(t);box.appendChild(b)});
}
function upd(){
  // สรุปวัน
  if(!pickupDate)$('sum').innerHTML='กรุณาแตะเลือก<b>วันรับรถ</b>';
  else if(!returnDate)$('sum').innerHTML='รับรถ <b>'+dmy(pickupDate)+'</b><br>เลือกสถานที่และเวลารับรถด้านล่าง แล้วแตะ<b>วันคืนรถ</b>';
  else{const n=Math.round((returnDate-pickupDate)/86400000)+1;$('sum').innerHTML='รับรถ <b>'+dmy(pickupDate)+'</b> → คืนรถ <b>'+dmy(returnDate)+'</b> · รวม '+n+' วัน'}

  // ขั้นตอน: วันรับ -> สถานที่รับ -> เวลารับ -> วันคืน -> สถานที่คืน -> เวลาคืน
  const s1=!!pickupDate;
  const s2=s1&&okLoc(pickLocVal());
  const pickReady=s2&&!!pickTime;            // ขั้นรับรถครบแล้ว
  const s3=pickReady&&!!returnDate;
  const s4=s3&&okLoc(retLocVal());
  const done=s4&&!!retTime;
  // ยุบกล่องรับรถเมื่อครบแล้วและไม่ได้กดแก้ไข เพื่อไม่ให้ค่ารับรถค้างปนกับขั้นคืนรถ
  const showPickBoxes=s1&&(editPick||!pickReady);

  // สรุปย่อขั้นรับรถ (แสดงแทนกล่อง 1-2 เมื่อยุบ)
  $('pickDone').classList.toggle('show',pickReady&&!showPickBoxes);
  if(pickReady&&!showPickBoxes)
    $('pickDone').innerHTML='<button class="edit" id="editPickBtn" type="button">แก้ไข</button>✅ <b>รับรถ</b> '+dmy(pickupDate)+' · เวลา '+pickTime+' น. · '+pickLocVal();

  // 1 สถานที่รับรถ
  $('secPickLoc').classList.toggle('show',showPickBoxes);
  if(showPickBoxes)drawLocs('pickLocs','pickLocIn',pickLoc,v=>{pickLoc=v;upd();scrollTo('secPickTime')});
  // 2 เวลารับรถ
  const showPickTime=showPickBoxes&&s2;
  $('secPickTime').classList.toggle('show',showPickTime);
  if(showPickTime){$('pickTimeDay').textContent=dmy(pickupDate);
    drawTimes('pickTimes',pickupDate,pickTime,t=>{pickTime=t;editPick=false;focus='return';draw();scrollTo(returnDate?'secRetLoc':'needRet')},null)}
  // เตือนให้แตะวันคืนรถ (ข้อมูลรับรถครบแล้วแต่ยังไม่เลือกวันคืน)
  $('needRet').classList.toggle('show',pickReady&&!returnDate&&!showPickBoxes);
  // 3 สถานที่คืนรถ — ค่าว่างเสมอหลังแตะวันคืนรถใหม่
  $('secRetLoc').classList.toggle('show',s3);
  if(s3)drawLocs('retLocs','retLocIn',retLoc,v=>{retLoc=v;upd();scrollTo('secRetTime')});
  // 4 เวลาคืนรถ (ถ้าคืนวันเดียวกับวันรับ ต้องหลังเวลารับอย่างน้อย 30 นาที)
  $('secRetTime').classList.toggle('show',s4);
  if(s4){
    $('retTimeDay').textContent=dmy(returnDate);
    let nb=null;
    if(sameDay(pickupDate,returnDate)&&pickTime){const[h,m]=pickTime.split(':').map(Number);nb=h*60+m+30}
    if(nb&&retTime){const[h,m]=retTime.split(':').map(Number);if(h*60+m<nb)retTime=null}
    drawTimes('retTimes',returnDate,retTime,t=>{retTime=t;upd();scrollTo('recap')},nb);
  }

  // สรุปก่อนยืนยัน
  $('recap').classList.toggle('show',done);
  if(done)$('recap').innerHTML='📅 <b>รับรถ</b> '+dmy(pickupDate)+' เวลา '+pickTime+' น.<br>📍 '+pickLocVal()
    +'<hr style="border:0;border-top:1px dashed #fed7aa;margin:8px 0">📅 <b>คืนรถ</b> '+dmy(returnDate)+' เวลา '+retTime+' น.<br>📍 '+retLocVal();

  $('sendBtn').disabled=!done;
  $('sendBtn').textContent=done?'ยืนยันการจอง':
    !pickupDate?'กรุณาเลือกวันรับรถ':
    !s2?'กรุณาเลือกสถานที่รับรถ':
    !pickReady?'กรุณาเลือกเวลารับรถ':
    !returnDate?'กรุณาเลือกวันคืนรถ':
    !s4?'กรุณาเลือกสถานที่คืนรถ':'กรุณาเลือกเวลาคืนรถ';

  const eb=$('editPickBtn');
  if(eb)eb.onclick=()=>{editPick=true;focus='pickup';draw();scrollTo('secPickLoc')};
}
async function send(){
  const pl=pickLocVal(),rl=retLocVal();
  if(!pickupDate||!returnDate||!pickTime||!retTime||!okLoc(pl)||!okLoc(rl))return;
  $('sendBtn').disabled=true;$('msg').textContent='กำลังส่งข้อมูลที่เลือก...';$('err').textContent='';
  try{
    await ready;
    if(!liff.isInClient())throw Error('กรุณาเปิดจากแชต LINE โดยตรง');
    const t=liff.getContext()&&liff.getContext().type;
    if(t&&!['utou','group','room'].includes(t))throw Error('กรุณาเปิดลิงก์นี้จากห้องแชต LINE (ไม่ใช่จากเมนู/เบราว์เซอร์)');
    // ส่งข้อความเดียว ครบทั้งรับ-คืน (v12)
    await liff.sendMessages([
      {type:'text',text:'เลือกวันรับรถ '+dmy(pickupDate)+' เวลา '+pickTime+' น. สถานที่ '+pl.replace(/\s+/g,' ')
        +'\nวันคืนรถ '+dmy(returnDate)+' เวลา '+retTime+' น. สถานที่ '+rl.replace(/\s+/g,' ')}
    ]);
    $('msg').textContent='ส่งเรียบร้อยแล้ว';setTimeout(()=>liff.closeWindow(),300);
  }catch(e){$('sendBtn').disabled=false;$('msg').textContent='';$('err').textContent='ส่งไม่สำเร็จ: '+(e.code?e.code+' - ':'')+(e.message||e)}
}
$('sendBtn').onclick=send;
$('goCal').onclick=()=>{focus='return';editPick=false;draw();scrollTo('grid')};
$('pickLocIn').oninput=upd;
$('retLocIn').oninput=upd;
