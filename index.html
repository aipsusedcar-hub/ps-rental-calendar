<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS Car Rental Calendar</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--o:#f97316;--ink:#111827;--muted:#667085;--line:#eaecf0}*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:Arial,"Noto Sans Thai",sans-serif;color:var(--ink)}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff}.head{background:var(--o);color:#fff;padding:18px;border-radius:0 0 22px 22px}.head b{font-size:20px}.hint{font-size:13px;margin-top:5px}.tabs{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1;border:0;border-radius:10px;padding:10px;background:#ffffff38;color:#fff}.tabs .on{background:#fff;color:var(--o);font-weight:700}main{padding:16px}.nav{display:flex;align-items:center;justify-content:space-between}.nav button{border:0;background:#fff;color:#667085;font-size:28px;width:42px;height:42px}.label{border:0;background:#fff;font-size:21px;font-weight:700;color:var(--ink)}.picker{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.picker.show{display:grid}.picker button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:15px}.picker button.active{border-color:var(--o);color:var(--o);font-weight:700}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:var(--muted);font-size:13px;padding:8px 0;font-weight:700}.day{height:44px;border:0;background:#fff;border-radius:22px;font-size:16px}.day.off{color:#d0d5dd}.day.today{outline:1px solid var(--o);color:var(--o)}.day:active{background:var(--o);color:#fff}#status,#error{font-size:13px;text-align:center;margin-top:14px}.error{color:#b42318}
</style></head>
<body><div class="app"><div class="head"><b>เลือกวันเช่ารถ</b><div class="hint">กดเลือกปี เดือน และวันที่ได้เลย</div><div class="tabs"><button id="pickup" class="on">วันรับรถ</button><button id="return">วันคืนรถ</button></div></div><main><div class="nav"><button id="prev">‹</button><button id="yearLabel" class="label"></button><button id="next">›</button></div><div id="yearPicker" class="picker"></div><div id="monthPicker" class="picker"></div><div class="nav"><button id="monthLabel" class="label"></button><span></span><span></span></div><div class="week"><div>อาทิตย์</div><div>จันทร์</div><div>อังคาร</div><div>พุธ</div><div>พฤหัสบดี</div><div>ศุกร์</div><div>เสาร์</div></div><div id="grid" class="grid"></div><div id="status"></div><div id="error" class="error"></div></main></div>
<script>
const LIFF_ID='2012569735-v6ST3dSo',months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],now=new Date(),minDate=new Date(now.getFullYear(),now.getMonth(),now.getDate()),maxDate=new Date(now.getFullYear()+2,11,31);let view=new Date(minDate.getFullYear(),minDate.getMonth(),1),step=new URLSearchParams(location.search).get('step')==='return'?'return':'pickup';const ready=liff.init({liffId:LIFF_ID}).catch(e=>error.textContent='เปิด LIFF ไม่สำเร็จ: '+(e.message||e));function same(a,b){return a.toDateString()===b.toDateString()}function iso(d){return d.toISOString().slice(0,10)}function draw(){yearLabel.textContent=view.getFullYear()+543;monthLabel.textContent=months[view.getMonth()];grid.innerHTML='';let first=new Date(view.getFullYear(),view.getMonth(),1).getDay(),days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let i=0;i<first;i++)grid.appendChild(document.createElement('span'));for(let d=1;d<=days;d++){let date=new Date(view.getFullYear(),view.getMonth(),d),b=document.createElement('button');b.className='day';b.textContent=d;if(date<minDate||date>maxDate){b.classList.add('off');b.disabled=true}else{if(same(date,now))b.classList.add('today');b.onclick=()=>send(date)}grid.appendChild(b)}prev.disabled=view<=new Date(minDate.getFullYear(),minDate.getMonth(),1);next.disabled=view>=new Date(maxDate.getFullYear(),maxDate.getMonth(),1)}function years(){yearPicker.innerHTML='';for(let y=minDate.getFullYear();y<=maxDate.getFullYear();y++){let b=document.createElement('button');b.textContent=y+543;b.className=y===view.getFullYear()?'active':'';b.onclick=()=>{view.setFullYear(y);yearPicker.classList.remove('show');draw()};yearPicker.appendChild(b)}}function mons(){monthPicker.innerHTML='';for(let m=0;m<12;m++){let b=document.createElement('button');b.textContent=months[m];let a=new Date(view.getFullYear(),m+1,0),z=new Date(view.getFullYear(),m,1);b.disabled=a<minDate||z>maxDate;b.className=m===view.getMonth()?'active':'';b.onclick=()=>{view.setMonth(m);monthPicker.classList.remove('show');draw()};monthPicker.appendChild(b)}}async function send(date){status.textContent='กำลังส่งวันที่เลือก...';error.textContent='';try{await ready;if(!liff.isInClient())throw Error('กรุณาเปิดจากแชต LINE โดยตรง');if(!liff.isApiAvailable('sendMessages'))throw Error('ไม่รองรับการส่งข้อความในหน้านี้');await liff.sendMessages([{type:'text',text:(step==='pickup'?'เลือกวันรับรถ ':'เลือกวันคืนรถ ')+iso(date)}]);status.textContent='ส่งวันที่เรียบร้อยแล้ว';setTimeout(()=>liff.closeWindow(),300)}catch(e){status.textContent='';error.textContent='ส่งไม่สำเร็จ: '+(e.code?e.code+' - ':'')+(e.message||e)}}prev.onclick=()=>{view.setMonth(view.getMonth()-1);draw()};next.onclick=()=>{view.setMonth(view.getMonth()+1);draw()};yearLabel.onclick=()=>{monthPicker.classList.remove('show');yearPicker.classList.toggle('show');years()};monthLabel.onclick=()=>{yearPicker.classList.remove('show');monthPicker.classList.toggle('show');mons()};pickup.onclick=()=>{step='pickup';pickup.classList.add('on');document.getElementById('return').classList.remove('on')};document.getElementById('return').onclick=()=>{step='return';document.getElementById('return').classList.add('on');pickup.classList.remove('on')};draw();
</script></body></html>
